# Vercel Deployment Configuration
# This file tells Vercel how to deploy the Easy Movie Ticket application

# Build settings
build_command = "npm run build"
publish_directory = "dist"

# Runtime settings  
[settings]
command = "npm run build"
publish = "dist"
base = "client"

# Redirects for SPA
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Headers for security
[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-XSS-Protection = "1; mode=block"